<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEXANIMA</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  padding: 0;
  background-color: #f4f1e8;
  font-family: 'Cormorant Garamond', serif;
  color: #1a1a1a;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  text-align: center;
}

.container {
  max-width: 500px;
  padding: 40px;
}

h1 {
  font-family: 'Cinzel', serif;
  letter-spacing: 6px;
  font-size: 42px;
  margin-bottom: 10px;
}

.subtitle {
  font-size: 18px;
  margin-bottom: 30px;
  opacity: 0.8;
}

.line {
  width: 80px;
  height: 1px;
  background-color: #1a1a1a;
  margin: 20px auto 30px auto;
}

.description {
  font-size: 16px;
  margin-bottom: 40px;
}

input {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border: 1px solid #1a1a1a;
  background-color: transparent;
  margin-bottom: 20px;
  text-align: center;
}

button {
  background-color: #7a1c1c;
  color: white;
  border: none;
  padding: 12px 30px;
  font-size: 14px;
  letter-spacing: 2px;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}
</style>
</head>

<body>
<div class="container">

<h1>LEXANIMA</h1>
<div class="line"></div>

<div class="subtitle">Ex litteris forma animae</div>

<div class="description">
Sistema simbolico contemporaneo basato sull’alfabeto romano.
Interpreta il nome come configurazione identitaria ed evolutiva.
</div>

<input type="text" placeholder="Inserisci il nome">

<button>ANALIZZA</button>

</div>
</body>
</html>
