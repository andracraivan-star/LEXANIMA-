<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEXANIMA</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">

<style>
  body{
    margin:0;
    padding:0;
    background-color:#f4f1e8;
    font-family:'Cormorant Garamond',serif;
    color:#1a1a1a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
  }
  .container{max-width:520px;padding:40px;}
  h1{
    font-family:'Cinzel',serif;
    letter-spacing:6px;
    font-size:42px;
    margin:0 0 10px 0;
  }
  .line{
    width:80px;height:1px;background-color:#1a1a1a;
    margin:16px auto 22px auto;
  }
  .subtitle{font-size:18px;margin-bottom:18px;opacity:.82;}
  .description{font-size:16px;margin:0 auto 26px auto;line-height:1.35;}
  .langbar{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:0 0 26px 0;
  }
  .langbtn{
    background:transparent;
    border:1px solid #1a1a1a;
    padding:6px 10px;
    font-size:13px;
    letter-spacing:1px;
    cursor:pointer;
  }
  .langbtn.active{
    background-color:#1a1a1a;
    color:#f4f1e8;
  }
  input{
    width:100%;
    padding:12px;
    font-size:16px;
    border:1px solid #1a1a1a;
    background-color:transparent;
    margin-bottom:18px;
    text-align:center;
  }
  button{
    background-color:#7a1c1c;
    color:#fff;
    border:none;
    padding:12px 30px;
    font-size:14px;
    letter-spacing:2px;
    cursor:pointer;
  }
  button:hover{opacity:.92;}
  .note{
    font-size:14px;
    opacity:.75;
    margin-top:18px;
    line-height:1.25;
  }
</style>
</head>

<body>
<div class="container">

  <h1>LEXANIMA</h1>
  <div class="line"></div>

  <div id="subtitle" class="subtitle"></div>
  <div id="description" class="description"></div>

  <div class="langbar" aria-label="Language selector">
    <button class="langbtn active" id="btn-it" type="button" onclick="setLang('it')">IT</button>
    <button class="langbtn" id="btn-ro" type="button" onclick="setLang('ro')">RO</button>
    <button class="langbtn" id="btn-en" type="button" onclick="setLang('en')">EN</button>
  </div>

  <input id="nameInput" type="text" autocomplete="name" placeholder="">
  <button id="analyzeBtn" type="button">ANALIZZA</button>

  <div id="note" class="note"></div>

</div>

<script>

const LETTERS = {
A:{a:"Origine",e:"Fuoco"},
B:{a:"Radicamento",e:"Terra"},
C:{a:"Movimento",e:"Aria"},
D:{a:"Direzione",e:"Fuoco"},
E:{a:"Espansione",e:"Aria"},
F:{a:"Struttura",e:"Terra"},
G:{a:"Generazione",e:"Acqua"},
H:{a:"Connessione",e:"Aria"},
I:{a:"Identità",e:"Fuoco"},
J:{a:"Slancio",e:"Fuoco"},
K:{a:"Forza",e:"Terra"},
L:{a:"Legame",e:"Acqua"},
M:{a:"Nutrimento",e:"Acqua"},
N:{a:"Transizione",e:"Acqua"},
O:{a:"Totalità",e:"Acqua"},
P:{a:"Potenziale",e:"Terra"},
Q:{a:"Ricerca",e:"Aria"},
R:{a:"Risonanza",e:"Aria"},
S:{a:"Trasformazione",e:"Acqua"},
T:{a:"Stabilità",e:"Terra"},
U:{a:"Profondità",e:"Acqua"},
V:{a:"Volontà",e:"Fuoco"},
W:{a:"Dualità",e:"Aria"},
X:{a:"Crocevia",e:"Aria"},
Y:{a:"Scelta",e:"Aria"},
Z:{a:"Compimento",e:"Terra"}
};

const ELEMENT_TEXT = {
it:{
Fuoco:"energia di impulso e iniziativa",
Terra:"energia di struttura e costruzione",
Aria:"energia mentale e relazionale",
Acqua:"energia emotiva e trasformativa",
direction:(first,last)=>`Potrebbe emergere una dinamica tra ${first} e ${last}. Una possibile direzione di integrazione è armonizzare questi due poli nella tua esperienza.`
},
ro:{
Fuoco:"energie de inițiativă și impuls",
Terra:"energie de structură și construcție",
Aria:"energie mentală și relațională",
Acqua:"energie emoțională și transformatoare",
direction:(first,last)=>`Poate apărea o dinamică între ${first} și ${last}. O posibilă direcție de integrare este armonizarea acestor două energii.`
},
en:{
Fuoco:"energy of initiative and drive",
Terra:"energy of structure and grounding",
Aria:"mental and relational energy",
Acqua:"emotional and transformative energy",
direction:(first,last)=>`A dynamic may arise between ${first} and ${last}. A possible direction of integration is to harmonize these two forces.`
}
};

function analyzeName(){
const name = document.getElementById("nameInput").value.toUpperCase().replace(/[^A-Z]/g,"");
if(!name) return;

let elementsCount = {Fuoco:0,Terra:0,Aria:0,Acqua:0};
let archetypes = [];

for(let letter of name){
if(LETTERS[letter]){
elementsCount[LETTERS[letter].e]++;
archetypes.push(LETTERS[letter].a);
}
}

const first = LETTERS[name[0]]?.a || "";
const last = LETTERS[name[name.length-1]]?.a || "";

let dominantElement = Object.keys(elementsCount).reduce((a,b)=>
elementsCount[a]>elementsCount[b]?a:b
);

const lang = document.documentElement.lang || "it";

let result = `
<h2>SCHEDA ARCHETIPICA – ${name}</h2>
<p><strong>Archetipi:</strong> ${archetypes.join(" – ")}</p>
<p><strong>Energia dominante:</strong> ${ELEMENT_TEXT[lang][dominantElement]}</p>
<p><strong>Direzione:</strong> ${ELEMENT_TEXT[lang].direction(first,last)}</p>
`;

document.getElementById("note").innerHTML = result;
}

document.getElementById("analyzeBtn").addEventListener("click", analyzeName);

</script>



</body>
</html>
