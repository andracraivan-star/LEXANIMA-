<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEXANIMA</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">

<style>
  body{
    margin:0;
    padding:0;
    background-color:#f4f1e8;
    font-family:'Cormorant Garamond',serif;
    color:#1a1a1a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
  }
  .container{max-width:520px;padding:40px;}
  h1{
    font-family:'Cinzel',serif;
    letter-spacing:6px;
    font-size:42px;
    margin:0 0 10px 0;
  }
  .line{
    width:80px;height:1px;background-color:#1a1a1a;
    margin:16px auto 22px auto;
  }
  .subtitle{font-size:18px;margin-bottom:18px;opacity:.82;}
  .description{font-size:16px;margin:0 auto 26px auto;line-height:1.35;}
  .langbar{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:0 0 26px 0;
  }
  .langbtn{
    background:transparent;
    border:1px solid #1a1a1a;
    padding:6px 10px;
    font-size:13px;
    letter-spacing:1px;
    cursor:pointer;
  }
  .langbtn.active{
    background-color:#1a1a1a;
    color:#f4f1e8;
  }
  input{
    width:100%;
    padding:12px;
    font-size:16px;
    border:1px solid #1a1a1a;
    background-color:transparent;
    margin-bottom:18px;
    text-align:center;
  }
  button{
    background-color:#7a1c1c;
    color:#fff;
    border:none;
    padding:12px 30px;
    font-size:14px;
    letter-spacing:2px;
    cursor:pointer;
  }
  button:hover{opacity:.92;}
  .note{
    font-size:14px;
    opacity:.75;
    margin-top:18px;
    line-height:1.25;
  }
</style>
</head>

<body>
<div class="container">

  <h1>LEXANIMA</h1>
  <div class="line"></div>

  <div id="subtitle" class="subtitle"></div>
  <div id="description" class="description"></div>

  <div class="langbar" aria-label="Language selector">
    <button class="langbtn active" id="btn-it" type="button" onclick="setLang('it')">IT</button>
    <button class="langbtn" id="btn-ro" type="button" onclick="setLang('ro')">RO</button>
    <button class="langbtn" id="btn-en" type="button" onclick="setLang('en')">EN</button>
  </div>

  <input id="nameInput" type="text" autocomplete="name" placeholder="">
  <button id="analyzeBtn" type="button">ANALIZZA</button>
  <div id="result" class="note"></div>
  <div id="note" class="note"></div>

</div>

<script>
  const T = {
    it: {
      subtitle: "Ex litteris forma animae",
      description: "Sistema simbolico contemporaneo basato sull’alfabeto romano. Interpreta il nome come configurazione identitaria ed evolutiva.",
      placeholder: "Inserisci il nome",
      button: "ANALIZZA",
      note: "La Direzione può essere latente, attiva o integrata. Il sistema offre la mappa."
    },
    ro: {
      subtitle: "Ex litteris forma animae",
      description: "Sistem simbolic contemporan bazat pe alfabetul roman. Interpretează numele ca o configurație identitară și evolutivă.",
      placeholder: "Introdu numele",
      button: "ANALIZEAZĂ",
      note: "Direcția poate fi latentă, activă sau integrată. Sistemul oferă harta."
    },
    en: {
      subtitle: "Ex litteris forma animae",
      description: "A contemporary symbolic system based on the Roman alphabet. It interprets the name as an identity and evolutionary configuration.",
      placeholder: "Enter the name",
      button: "ANALYZE",
      note: "Direction can be latent, active, or integrated. The system offers the map."
    }
  };
const RESULT_UI = {
  it: { sheet: "SCHEDA ARCHETIPICA", archetypes: "Archetipi" },
  ro: { sheet: "FIȘĂ ARHETIPALĂ", archetypes: "Arhetipuri" },
  en: { sheet: "ARCHETYPAL SHEET", archetypes: "Archetypes" }
};
  const LETTERS = {
    A:{a:"Origine",e:"Fuoco"},
    B:{a:"Radicamento",e:"Terra"},
    C:{a:"Movimento",e:"Aria"},
    D:{a:"Direzione",e:"Fuoco"},
    E:{a:"Espansione",e:"Aria"},
    F:{a:"Struttura",e:"Terra"},
    G:{a:"Generazione",e:"Acqua"},
    H:{a:"Connessione",e:"Aria"},
    I:{a:"Identità",e:"Fuoco"},
    J:{a:"Slancio",e:"Fuoco"},
    K:{a:"Forza",e:"Terra"},
    L:{a:"Legame",e:"Acqua"},
    M:{a:"Nutrimento",e:"Acqua"},
    N:{a:"Transizione",e:"Acqua"},
    O:{a:"Totalità",e:"Acqua"},
    P:{a:"Potenziale",e:"Terra"},
    Q:{a:"Ricerca",e:"Aria"},
    R:{a:"Risonanza",e:"Aria"},
    S:{a:"Trasformazione",e:"Acqua"},
    T:{a:"Stabilità",e:"Terra"},
    U:{a:"Profondità",e:"Acqua"},
    V:{a:"Volontà",e:"Fuoco"},
    W:{a:"Dualità",e:"Aria"},
    X:{a:"Crocevia",e:"Aria"},
    Y:{a:"Scelta",e:"Aria"},
    Z:{a:"Compimento",e:"Terra"}
  };

  const ELEMENT_PHRASE = {
    it:{
      Fuoco:"Fuoco",
      Terra:"Terra",
      Aria:"Aria",
      Acqua:"Acqua",
      energy:(el)=>`Energia dominante: ${el}.`,
      direction:(first,last)=>`Direzione: potrebbe emergere una dinamica tra ${first} e ${last}. Una possibile direzione di integrazione è armonizzare questi due poli nella tua esperienza.`
    },
    ro:{
      Fuoco:"Foc",
      Terra:"Pământ",
      Aria:"Aer",
      Acqua:"Apă",
      energy:(el)=>`Energie dominantă: ${el}.`,
      direction:(first,last)=>`Direcție: poate apărea o dinamică între ${first} și ${last}. O posibilă direcție de integrare este armonizarea acestor două energii.`
    },
    en:{
      Fuoco:"Fire",
      Terra:"Earth",
      Aria:"Air",
      Acqua:"Water",
      energy:(el)=>`Dominant energy: ${el}.`,
      direction:(first,last)=>`Direction: a dynamic may arise between ${first} and ${last}. A possible direction of integration is to harmonize these two forces.`
    }
  };

  let currentLang = "it";
const ARCH_GLOSS = {
  Origine:{it:"inizio e auto-generazione",ro:"început și auto-generare",en:"beginnings and self-generation"},
  Radicamento:{it:"stabilità e concretezza",ro:"stabilitate și concret",en:"stability and concreteness"},
  Movimento:{it:"cambiamento e flusso",ro:"schimbare și flux",en:"change and flow"},
  Direzione:{it:"scelta e orientamento",ro:"alegere și orientare",en:"choice and direction"},
  Espansione:{it:"apertura e possibilità",ro:"deschidere și posibilități",en:"openness and possibilities"},
  Struttura:{it:"ordine e disciplina",ro:"ordine și disciplină",en:"order and discipline"},
  Generazione:{it:"creazione e crescita",ro:"creare și creștere",en:"creation and growth"},
  Connessione:{it:"legami e rete",ro:"legături și rețea",en:"links and network"},
  Identità:{it:"io e presenza",ro:"eu și prezență",en:"self and presence"},
  Slancio:{it:"spinta e coraggio",ro:"impuls și curaj",en:"drive and courage"},
  Forza:{it:"resistenza e centratura",ro:"rezistență și centrare",en:"strength and grounding"},
  Legame:{it:"vicinanza e fiducia",ro:"apropiere și încredere",en:"closeness and trust"},
  Nutrimento:{it:"cura e continuità",ro:"grijă și continuitate",en:"care and continuity"},
  Transizione:{it:"passaggio e adattamento",ro:"tranziție și adaptare",en:"transition and adaptation"},
  Totalità:{it:"integrazione e completezza",ro:"integrare și întreg",en:"integration and wholeness"},
  Potenziale:{it:"risorsa e maturazione",ro:"resursă și maturizare",en:"resource and maturation"},
  Ricerca:{it:"domande e chiarimento",ro:"întrebări și clarificare",en:"inquiry and clarity"},
  Risonanza:{it:"significato e comunicazione",ro:"sens și comunicare",en:"meaning and communication"},
  Trasformazione:{it:"profondità e muta",ro:"profunzime și schimbare",en:"depth and change"},
  Stabilità:{it:"costanza e basi",ro:"constanță și baze",en:"consistency and foundations"},
  Profondità:{it:"interiorità e verità",ro:"interior și adevăr",en:"inner depth and truth"},
  Volontà:{it:"decisione e azione",ro:"decizie și acțiune",en:"decision and action"},
  Dualità:{it:"polarità e scelta",ro:"polaritate și alegere",en:"polarity and choice"},
  Crocevia:{it:"svolta e alternative",ro:"răscruce și alternative",en:"turning point and options"},
  Scelta:{it:"priorità e tagli",ro:"priorități și decizii",en:"priorities and decisions"},
  Compimento:{it:"chiusura e risultato",ro:"încheiere și rezultat",en:"closure and outcome"}
};

const EX_LABELS = {
  it:{title:"Esempi pratici",w:"Lavoro",r:"Relazioni",s:"Crescita personale"},
  ro:{title:"Exemple practice",w:"Muncă",r:"Relații",s:"Creștere personală"},
  en:{title:"Practical examples",w:"Work",r:"Relationships",s:"Personal growth"}
};

function gloss(ar){
  if(currentLang === "it") return ar;

  const names = {
    Origine: { ro:"Origine", en:"Origin" },
    Radicamento:{ ro:"Înrădăcinare", en:"Grounding" },
    Movimento:{ ro:"Mișcare", en:"Movement" },
    Direzione:{ ro:"Direcție", en:"Direction" },
    Espansione:{ ro:"Expansiune", en:"Expansion" },
    Struttura:{ ro:"Structură", en:"Structure" },
    Generazione:{ ro:"Generare", en:"Generation" },
    Connessione:{ ro:"Conexiune", en:"Connection" },
    Identità:{ ro:"Identitate", en:"Identity" },
    Slancio:{ ro:"Impuls", en:"Drive" },
    Forza:{ ro:"Forță", en:"Strength" },
    Legame:{ ro:"Legătură", en:"Bond" },
    Nutrimento:{ ro:"Hrănire", en:"Nourishment" },
    Transizione:{ ro:"Tranziție", en:"Transition" },
    Totalità:{ ro:"Totalitate", en:"Totality" },
    Potenziale:{ ro:"Potențial", en:"Potential" },
    Ricerca:{ ro:"Cercetare", en:"Inquiry" },
    Risonanza:{ ro:"Rezonanță", en:"Resonance" },
    Trasformazione:{ ro:"Transformare", en:"Transformation" },
    Stabilità:{ ro:"Stabilitate", en:"Stability" },
    Profondità:{ ro:"Profunzime", en:"Depth" },
    Volontà:{ ro:"Voință", en:"Will" },
    Dualità:{ ro:"Dualitate", en:"Duality" },
    Crocevia:{ ro:"Răscruce", en:"Crossroads" },
    Scelta:{ ro:"Alegere", en:"Choice" },
    Compimento:{ ro:"Împlinire", en:"Completion" }
  };

  return names[ar]?.[currentLang] || ar;
}

function directionText(first,last){
  if(first === last){
    if(currentLang==="it") return `Direzione: lo stesso archetipo apre e chiude il nome (${first}). Il tema tende a essere ciclico: ritorni all’essenza, riparti, rigeneri.`;
    if(currentLang==="ro") return `Direcție: același arhetip deschide și închide numele (${first}). Tema poate fi ciclic: revii la esență, reîncepi, te regenerezi.`;
    return `Direction: the same archetype opens and closes the name (${first}). The theme can be cyclical: returning to the essence, restarting, regenerating.`;
  }
  if(currentLang==="it") return `Direzione: potrebbe emergere una dinamica tra ${first} (${gloss(first)}) e ${last} (${gloss(last)}). Una possibile integrazione è far collaborare inizio e sostegno.`;
  if(currentLang==="ro") return `Direcție: poate apărea o dinamică între ${first} (${gloss(first)}) și ${last} (${gloss(last)}). O posibilă integrare este să le lași să colaboreze.`;
  return `Direction: a dynamic may arise between ${first} (${gloss(first)}) and ${last} (${gloss(last)}). A possible integration is to let them cooperate.`;
}

function examplesList(first,last){
  const L = EX_LABELS[currentLang];
  if(first === last){
    if(currentLang==="it") return [
      `${L.w}: iniziare e ripartire più volte finché trovi la forma giusta, poi stabilizzare.`,
      `${L.r}: bisogno di autenticità; rientrare in sé prima di aprirsi agli altri.`,
      `${L.s}: pratica di “ritorno al centro”: chiudere cicli e rinascere più lucida.`
    ];
    if(currentLang==="ro") return [
      `${L.w}: să începi și să reîncepi până găsești forma potrivită, apoi să stabilizezi.`,
      `${L.r}: nevoia de autenticitate; să revii la tine înainte să te deschizi.`,
      `${L.s}: practică de “întoarcere la centru”: închei cicluri și renaști mai clar.`
    ];
    return [
      `${L.w}: starting and restarting until the right form appears, then stabilizing.`,
      `${L.r}: a need for authenticity; returning to yourself before opening to others.`,
      `${L.s}: a “back to center” practice: closing cycles and coming back clearer.`
    ];
  }

  if(currentLang==="it") return [
    `${L.w}: avviare ( ${first} ) e poi sostenere nel tempo ( ${last} ): meno sprint, più continuità.`,
    `${L.r}: autonomia e iniziativa ( ${first} ) senza perdere cura e presenza ( ${last} ).`,
    `${L.s}: trasformare l’impulso iniziale ( ${first} ) in un gesto che nutre e consolida ( ${last} ).`
  ];
  if(currentLang==="ro") return [
    `${L.w}: să pornești ( ${first} ) și apoi să susții în timp ( ${last} ): mai puțin sprint, mai multă continuitate.`,
    `${L.r}: autonomie și inițiativă ( ${first} ) fără să pierzi grijă și prezență ( ${last} ).`,
    `${L.s}: să transformi impulsul inițial ( ${first} ) într-un gest care hrănește și consolidează ( ${last} ).`
  ];
  return [
    `${L.w}: initiating ( ${first} ) and then sustaining over time ( ${last} ): less sprint, more continuity.`,
    `${L.r}: autonomy and initiative ( ${first} ) without losing care and presence ( ${last} ).`,
    `${L.s}: turning the initial impulse ( ${first} ) into something that nourishes and consolidates ( ${last} ).`
  ];
}
  function setLang(lang){
    currentLang = lang;
    document.documentElement.lang = lang;

    document.getElementById("subtitle").textContent = T[lang].subtitle;
    document.getElementById("description").textContent = T[lang].description;
    document.getElementById("nameInput").placeholder = T[lang].placeholder;
    document.getElementById("analyzeBtn").textContent = T[lang].button;
    document.getElementById("note").textContent = T[lang].note;

    ["it","ro","en"].forEach(l=>{
      document.getElementById("btn-"+l).classList.toggle("active", l===lang);
    });

    const r = document.getElementById("result");
    if (r) r.innerHTML = "";
  }

  function analyzeName(){
    const raw = document.getElementById("nameInput").value || "";
    const name = raw.toUpperCase().replace(/[^A-Z]/g,"");
    if(!name){
      document.getElementById("result").innerHTML = "";
      return;
    }

    const elementsCount = {Fuoco:0,Terra:0,Aria:0,Acqua:0};
    const archetypes = [];

    for(const ch of name){
      const info = LETTERS[ch];
      if(!info) continue;
      elementsCount[info.e]++;
      archetypes.push(gloss(info.a));
    }

    
const firstA = LETTERS[name[0]]?.a || "";
const lastA  = LETTERS[name[name.length-1]]?.a || "";
const directionMsg = directionText(firstA, lastA);
const exTitle = EX_LABELS[currentLang].title;
const exItems = examplesList(firstA, lastA);
    const dominantKey = Object.keys(elementsCount).reduce((best,k)=>{
      return elementsCount[k] > elementsCount[best] ? k : best;
    }, "Fuoco");

    const elLabel = ELEMENT_PHRASE[currentLang][dominantKey];

    document.getElementById("result").innerHTML =
  `<div style="margin-top:14px">
    <div style="font-weight:600; letter-spacing:1px">
      ${RESULT_UI[currentLang].sheet} – ${name}
    </div>

    <div style="margin-top:10px">
      <strong>${RESULT_UI[currentLang].archetypes}:</strong> ${archetypes.join(" – ")}
    </div>

    <div style="margin-top:6px">
      <strong>${ELEMENT_PHRASE[currentLang].energy(elLabel)}</strong>
    </div>

    <div style="margin-top:6px">${directionMsg}</div>

    <div style="margin-top:14px; font-weight:600;">${exTitle}</div>
    <ul style="margin:8px auto 0 auto; padding-left:18px; text-align:left; max-width:460px;">
      <li style="margin:6px 0;">${exItems[0]}</li>
      <li style="margin:6px 0;">${exItems[1]}</li>
      <li style="margin:6px 0;">${exItems[2]}</li>
    </ul>
  </div>`;

  
  }
  document.getElementById("analyzeBtn").addEventListener("click", analyzeName);

  // Espone setLang per gli onclick dei bottoni lingua
  window.setLang = setLang;

  setLang("it");
</script>



</body>
</html>
